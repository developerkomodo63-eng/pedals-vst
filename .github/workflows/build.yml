name: Build Guitar Pedals VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar todos los pedales
        run: cmake --build build --config Release --parallel

      - name: Subir Overdrive (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Windows
          path: |
            build/Pedals/Overdrive/Overdrive_artefacts/Release/VST3/**
            build/Pedals/Overdrive/Overdrive_artefacts/Release/Standalone/**

      - name: Subir Chorus (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-Windows
          path: |
            build/Pedals/Chorus/Chorus_artefacts/Release/VST3/**
            build/Pedals/Chorus/Chorus_artefacts/Release/Standalone/**

      - name: Subir Reverb (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Reverb-Windows
          path: |
            build/Pedals/Reverb/Reverb_artefacts/Release/VST3/**
            build/Pedals/Reverb/Reverb_artefacts/Release/Standalone/**

      - name: Subir Synth Guitar (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: SynthGuitar-Windows
          path: |
            build/Pedals/SynthGuitar/SynthGuitar_artefacts/Release/VST3/**
            build/Pedals/SynthGuitar/SynthGuitar_artefacts/Release/Standalone/**

      - name: Subir Synth Bass (VST3 + Standalone)
