name: Build Guitar Pedals VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar todos los pedales
        run: cmake --build build --config Release --parallel

      - name: Subir Overdrive (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Windows
          path: |
            build/Pedals/Overdrive/Overdrive_artefacts/Release/VST3/**
            build/Pedals/Overdrive/Overdrive_artefacts/Release/Standalone/**

      - name: Subir Chorus (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-Windows
          path: |
            build/Pedals/Chorus/Chorus_artefacts/Release/VST3/**
            build/Pedals/Chorus/Chorus_artefacts/Release/Standalone/**

      - name: Subir Reverb (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Reverb-Windows
          path: |
            build/Pedals/Reverb/Reverb_artefacts/Release/VST3/**
            build/Pedals/Reverb/Reverb_artefacts/Release/Standalone/**

      - name: Subir Synth Guitar (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: SynthGuitar-Windows
          path: |
            build/Pedals/SynthGuitar/SynthGuitar_artefacts/Release/VST3/**
            build/Pedals/SynthGuitar/SynthGuitar_artefacts/Release/Standalone/**

      - name: Subir Synth Bass (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: SynthBass-Windows
          path: |
            build/Pedals/SynthBass/SynthBass_artefacts/Release/VST3/**
            build/Pedals/SynthBass/SynthBass_artefacts/Release/Standalone/**

      - name: Subir Fuzz Guitar (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: FuzzGuitar-Windows
          path: |
            build/Pedals/FuzzGuitar/FuzzGuitar_artefacts/Release/VST3/**
            build/Pedals/FuzzGuitar/FuzzGuitar_artefacts/Release/Standalone/**

      - name: Subir Fuzz Bass (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: FuzzBass-Windows
          path: |
            build/Pedals/FuzzBass/FuzzBass_artefacts/Release/VST3/**
            build/Pedals/FuzzBass/FuzzBass_artefacts/Release/Standalone/**

      - name: Subir Distortion Guitar (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: DistortionGuitar-Windows
          path: |
            build/Pedals/DistortionGuitar/DistortionGuitar_artefacts/Release/VST3/**
            build/Pedals/DistortionGuitar/DistortionGuitar_artefacts/Release/Standalone/**

      - name: Subir Distortion Bass (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: DistortionBass-Windows
          path: |
            build/Pedals/DistortionBass/DistortionBass_artefacts/Release/VST3/**
            build/Pedals/DistortionBass/DistortionBass_artefacts/Release/Standalone/**

      - name: Subir Compressor (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Compressor-Windows
          path: |
            build/Pedals/Compressor/Compressor_artefacts/Release/VST3/**
            build/Pedals/Compressor/Compressor_artefacts/Release/Standalone/**

      - name: Subir Tremolo (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Tremolo-Windows
          path: |
            build/Pedals/Tremolo/Tremolo_artefacts/Release/VST3/**
            build/Pedals/Tremolo/Tremolo_artefacts/Release/Standalone/**

      - name: Subir Phaser (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Phaser-Windows
          path: |
            build/Pedals/Phaser/Phaser_artefacts/Release/VST3/**
            build/Pedals/Phaser/Phaser_artefacts/Release/Standalone/**

      - name: Subir Delay (VST3 + Standalone)
        uses: actions/upload-artifact@v4
        with:
          name: Delay-Windows
          path: |
            build/Pedals/Delay/Delay_artefacts/Release/VST3/**
            build/Pedals/Delay/Delay_artefacts/Release/Standalone/**
